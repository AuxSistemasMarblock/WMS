services:
  wms-backend:
    build: ./backend
    container_name: wms-backend
    restart: always
    env_file:
      - ${ENV_FILE:-backend/.env}
    volumes:
      # Service Account JSON de Google Sheets (read-only)
      - ./backend/secrets/spry-spanner-452018-s7-2e21e9a0fb5d.json:/app/backend/secrets/spry-spanner-452018-s7-2e21e9a0fb5d.json:ro
    ports:
      - "3001:3001"

  wms-frontend:
    build:
      context: .
      args:
        BACKEND_URL: ${BACKEND_URL:-http://localhost:3001}
        ENVIRONMENT: production
    container_name: wms-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - wms-backend
