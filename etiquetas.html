<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WMS · Etiquetas</title>
  <link rel="icon" href="images/logo_ico.png" type="image/png" />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/etiquetas.css" />
</head>
<body>

<div id="toast" class="toast"></div>

<div id="mainApp" style="display: none;">

  <header>
    <div class="logo">
      <img src="images/logo.png" alt="Logo Empresa" style="height:30px; width:auto; border-radius:6px; padding:2px;"/>
      WMS · ETIQUETAS
    </div>
    <div class="header-right">
      <div class="user-info">
        <div class="user-details">
          <div class="user-name" id="currentUserName">Usuario</div>
          <div class="user-meta">
            <span id="currentUserLocation">Ubicación</span> ·
            <span id="currentUserRole">Rol</span>
          </div>
        </div>
        <button class="btn btn-ghost" onclick="handleLogout()" title="Cerrar sesión">Logout</button>
      </div>
    </div>
    <span class="badge">ETIQUETAS</span>
  </header>

  <main class="etiquetas-main">

    <!-- BARRA DE BÚSQUEDA -->
    <section class="search-bar">
      <div class="search-input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Buscar por SKU, lote o descripción…" />
      </div>
      <div class="search-filters">
        <select id="filtroUbicacion" class="filter-select">
          <option value="">Todas las ubicaciones</option>
        </select>
        <button class="btn btn-primary" onclick="buscar()">Buscar</button>
      </div>
    </section>

    <div class="etiquetas-layout">

      <!-- RESULTADOS -->
      <section class="results-card">
        <div class="card-head">
          <div class="card-title">
            Resultados
            <span class="count-badge" id="countResult">0</span>
          </div>
          <button class="btn btn-ghost" onclick="limpiarBusqueda()" title="Limpiar búsqueda">Limpiar</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>SKU</th>
                <th>Descripción</th>
                <th>Lote</th>
                <th>Ubicación</th>
                <th class="num">Físico</th>
                <th class="num">M²/pieza</th>
                <th class="num">Máx</th>
                <th class="num"></th>
              </tr>
            </thead>
            <tbody id="tbodyResult">
              <tr><td colspan="8"><div class="empty-state">Cargando…</div></td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination" id="pagination" style="display:none;">
          <button class="page-btn" id="btnPrev" onclick="cambiarPagina(-1)">‹ Anterior</button>
          <span class="page-info" id="pageInfo">Página 1 de 1</span>
          <button class="page-btn" id="btnNext" onclick="cambiarPagina(1)">Siguiente ›</button>
        </div>
      </section>

      <!-- CARRITO DE ETIQUETAS SELECCIONADAS -->
      <aside class="cart-card" id="cartCard">
        <div class="card-head">
          <div class="card-title">
            Etiquetas seleccionadas
            <span class="count-badge" id="countCart">0</span>
          </div>
          <button class="btn btn-ghost btn-icon" onclick="vaciarCarrito()" title="Vaciar selección">✕</button>
        </div>

        <div class="cart-list" id="cartList">
          <div class="cart-empty">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4"/><path d="M9 12h6M9 16h6"/></svg>
            Agrega artículos desde los resultados
          </div>
        </div>

        <div class="cart-footer">
          <div class="cart-total">
            <span class="cart-total-label">Total a imprimir</span>
            <span class="cart-total-value" id="cartTotal">0</span>
            <span class="cart-total-unit">etiquetas</span>
          </div>
          <button class="btn btn-primary btn-wide" onclick="imprimirTodo()" id="btnImprimir" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            Imprimir a Zebra
          </button>
        </div>
      </aside>

    </div>

  </main>
</div>

<script src="js/config.js?v=4"></script>
<script src="js/etiquetas/app.js?v=4"></script>
</body>
</html>
