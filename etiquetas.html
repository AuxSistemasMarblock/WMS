<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WMS · Etiquetas</title>
  <link rel="icon" href="images/logo_ico.png" type="image/png" />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/etiquetas.css" />
</head>
<body>

<div id="toast" class="toast"></div>

<div id="mainApp" style="display: none;">

  <header>
    <div class="logo">
      <img src="images/logo.png" alt="Logo Empresa" style="height:30px; width:auto; border-radius:6px; padding:2px;"/>
      WMS · ETIQUETAS
    </div>
    <div class="header-right">
      <div class="user-info">
        <div class="user-details">
          <div class="user-name" id="currentUserName">Usuario</div>
          <div class="user-meta">
            <span id="currentUserLocation">Ubicación</span> ·
            <span id="currentUserRole">Rol</span>
          </div>
        </div>
        <button class="btn btn-ghost" onclick="handleLogout()" title="Cerrar sesión">Logout</button>
      </div>
    </div>
    <span class="badge">ETIQUETAS</span>
  </header>

  <main>

    <!-- FILTROS -->
    <section class="filters-card">
      <div class="filters-row">
        <div class="filter-group">
          <label>Ubicación</label>
          <select id="filtroUbicacion" class="filter-select" onchange="aplicarFiltros()">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="filter-group" style="flex:1; min-width:220px;">
          <label>SKU</label>
          <input id="filtroSku" type="text" placeholder="Buscar SKU..." oninput="aplicarFiltros()" />
        </div>
        <button class="btn btn-ghost" onclick="loadExistencias()" title="Recargar desde NetSuite">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          Recargar
        </button>
      </div>
    </section>

    <div class="etiquetas-layout">

      <!-- TABLA DE EXISTENCIAS -->
      <section class="table-card">
        <div class="table-header">
          <div class="table-title">
            Existencias
            <span class="count-badge" id="countExist">0</span>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>SKU</th>
                <th>Descripción</th>
                <th>Lote</th>
                <th>Ubicación</th>
                <th>Físico</th>
                <th>M²/pieza</th>
                <th>Máx etiquetas</th>
              </tr>
            </thead>
            <tbody id="tbodyExistencias">
              <tr><td colspan="7"><div class="empty-state">Cargando…</div></td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- PANEL DE ETIQUETA -->
      <aside class="etiquetas-panel" id="panelDetalle">
        <h2 class="panel-title">Etiqueta</h2>
        <div id="detalleVacio" class="empty-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
          Selecciona un artículo para generar su etiqueta
        </div>

        <div id="detalleContenido" style="display:none;">
          <dl class="detalle">
            <dt>SKU</dt><dd id="dSku">–</dd>
            <dt>Descripción</dt><dd id="dDescripcion">–</dd>
            <dt>Lote</dt><dd id="dLote">–</dd>
            <dt>Ubicación</dt><dd id="dUbicacion">–</dd>
            <dt>Físico (m²)</dt><dd id="dFisico">–</dd>
            <dt>M²/pieza</dt><dd id="dTotalM2">–</dd>
          </dl>

          <div class="field">
            <label for="cantidad">Cantidad de etiquetas</label>
            <input type="number" id="cantidad" min="1" value="1" />
            <small id="cantidadHint">Máx: –</small>
          </div>

          <div class="field">
            <label>Pedimento</label>
            <div id="pedimentoBox"></div>
          </div>

          <div class="preview" id="previewBox" style="display:none;">
            <label>Vista previa ZPL</label>
            <pre id="zplPreview"></pre>
          </div>

          <div class="actions">
            <button class="btn btn-ghost" onclick="generarZpl()">Generar vista previa</button>
            <button class="btn btn-primary" onclick="imprimir()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              Imprimir a Zebra
            </button>
          </div>
        </div>
      </aside>

    </div>

  </main>
</div>

<script src="js/config.js?v=4"></script>
<script src="js/etiquetas/app.js?v=4"></script>
</body>
</html>
